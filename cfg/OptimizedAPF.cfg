#!/usr/bin/env python
# 在线可调参数（dynamic_reconfigure）
# 其余参数（逃逸/安全/平滑等）在 params/optimized_apf.yaml 中配置
PACKAGE = "optimized_apf"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

#       Name         Type      Level  Description                          Default  Min    Max
gen.add("k_rep",     double_t, 0,     "Repulsive gain",                    0.5,     0.0,   10.0)
gen.add("eta_0",     double_t, 0,     "Obstacle influence distance (m)",   2.0,     0.3,   6.0)
gen.add("d_stop",    double_t, 0,     "Emergency stop distance (m)",       0.55,    0.1,   2.0)
gen.add("v_max",     double_t, 0,     "Max forward speed (m/s)",           1.0,     0.0,   3.0)
gen.add("w_max",     double_t, 0,     "Max yaw rate (rad/s)",              1.0,     0.0,   3.0)
gen.add("k_yaw",     double_t, 0,     "Heading P gain",                    1.5,     0.0,   5.0)

exit(gen.generate(PACKAGE, "optimized_apf", "OptimizedAPF"))