# ============================================================
# optimized_apf 参数（割草机器人差速底盘默认值，需按实车整定）
# ============================================================

# ---------- 斥力场 ----------
k_rep: 0.5            # 斥力增益（点云已按点数归一化，量纲与原 fields0 不同，需实测整定）
eta_0: 2.0            # 障碍影响距离(m)：约 2~3 秒行程；原 cfg 默认 6m 对割草机过大
robot_radius: 0.4     # 机体外接圆半径(m)：滤除球内点并把障碍点投影到球面（原硬编码 0.1，改为可配置）
d_stop: 0.55          # 急停距离(m)：最近障碍点 < d_stop 立即停车；必须 > robot_radius
estop_hysteresis: 0.1 # 急停解除滞环(m)：最近障碍 > d_stop + 滞环 才解除，防抖

# ---------- 速度自适应斥力（修复原 (vx+0.0115)/7.5 魔法数） ----------
v_nominal: 0.8        # 标称作业速度(m/s)
k_v_scale: 0.5        # 斥力缩放 = 1 + k_v_scale * max(0, vx_des)/v_nominal
                      # 低速时斥力不消失（原版低速时斥力趋于 0，危险），高速时增强

# ---------- 输出限幅与平滑（修复原输出无斜率限制） ----------
v_max: 1.0            # 最大前进速度(m/s)
w_max: 1.0            # 最大角速度(rad/s)
a_max: 0.6            # 线加速度限幅(m/s^2)，急停/卡死不受此限制
alpha_max: 1.5        # 角加速度限幅(rad/s^2)
k_yaw: 1.5            # 航向 P 增益（修复原分段转向死分支 bug，改为 P 控制+饱和）
yaw_deadband: 0.05    # 航向误差死区(rad)

# ---------- 局部极小检测与逃逸（替代原 |Fx|<0.04 -> Fy*=2 hack） ----------
stall_speed: 0.05     # 实际速度低于此值视为低速停滞(m/s)
stall_time: 2.0       # 避障中持续低速停滞超过该时间(s)触发逃逸
progress_check_time: 5.0   # 避障中位置净位移检查窗口(s)，用于发现爬行/振荡/绕圈
progress_min_distance: 0.08# 每个窗口要求的最小净位移(m)，需按里程计噪声整定
escape_speed: 0.3     # 逃逸期望速度(m/s)，仍受 v_max 限制并叠加斥力避障
escape_min_distance: 0.3# 沿逃逸目标方向实际走过该净位移才判定脱困成功(m)
escape_time: 3.0      # 单次逃逸尝试最长时长(s)，超时换另一侧
escape_max_tries: 3   # 连续逃逸失败次数上限，超过判定为永久阻塞
block_time: 20.0      # 持续受阻总时长上限(s)，超过发布重规划请求

# ---------- 状态恢复 ----------
normal_reset_time: 3.0  # 恢复正常行驶持续该时间(s)后清除逃逸计数/重规划请求

# ---------- 传感器与接口 ----------
control_rate: 30.0    # 控制频率(Hz)
scan_timeout: 0.5     # 激光超时(s)：未收到、无效或超时均立即停车并进入 SENSOR_FAULT
odom_timeout: 0.5     # 里程计超时(s)：失效立即停车并进入 ODOM_TIMEOUT
cmd_timeout: 0.5      # 期望速度超时(s)：失效立即停车并进入 CMD_TIMEOUT
laser_x: 0.0          # 激光安装偏移(m)，机体系，允许负值
laser_y: 0.0
laser_yaw: 0.0        # 激光安装朝向(rad)，机体系